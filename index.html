当成仪器底数。如果天上真有均匀背景，你会亲手把它当作「仪器误差」扣掉——差一点点，宇宙学就晚发现十年。"},{id:"b",correct:!0,label:"把接收机接到一个浸在液氦中的冷负载上——它的噪声温度可以从物理定律算出来",explanation:"正确。冷负载是一个理论值已知的「标准答案」：仪器读数与它对比，偏差就是仪器自身的底数。对照的核心是给测量一个已知锚点，且这个锚点不能来自待测对象本身。"},{id:"c",label:"用另一台同型号接收机的出厂标定值交叉核对",explanation:"听起来严谨，但同型号仪器往往共享同样的系统误差——两面一模一样的镜子照不出镜子本身的歪。而且标定值仍是他人在另一时刻的测量，不是不依赖测量的已知锚点。"}]}},{id:"p04",act:1,kind:"story",visual:"noise",title:"多出来的 3K",caption:"校准完成，底数清晰。可无论怎么测，天顶方向始终多出约 3K 的噪声温度——折合天线温度约 3.5K。这不在任何说明书里，也不在任何预期里。"},{id:"p05",act:1,kind:"quiz",visual:"stance",title:"面对异常的第一立场",caption:"一段没人预期过的噪声，静静躺在记录本上。",quiz:{prompt:"面对「多出来的 3K」，最合理的第一步立场是？",options:[{id:"a",label:"先查文献，看别的天文台是否也报告过类似的过量噪声",explanation:"查文献像侦探的直觉，但时机不对：在确认自己仪器底数之前，别人的数据无法帮你区分「真实信号」和「同类仪器的共同系统误差」。而且你连自己测到的是什么都还没界定，无从比对。"},{id:"b",label:"增加积分时间反复测量，先确认这 3K 在统计上显著存在",explanation:"统计显著只回答「它是不是随机涨落」，回答不了「它从哪来」。把一个系统误差测得更精确，得到的只是一个更精确的错误。显著性检验查的是运气，不是仪器。"},{id:"c",correct:!0,label:"先假设是自己还没弄懂这台仪器，把每个环节从头重查",explanation:"正确。科学惯例是：在宣布非凡发现之前，先穷尽平凡的解释。3K 太小，仪器嫌疑最大——这不丢人，这正是纪律。后来他们花了一年做的，正是这件事。"}]}},{id:"p06",act:1,kind:"story",visual:"daynight",title:"与时间无关",caption:"他们开始记录噪声的行为方式：白天测，夜里测；夏天测，冬天测。结果令人不安——噪声昼夜不变，四季不变，像一段恒定的背景，沉默地杵在那里。"},{id:"p07",act:1,kind:"quiz",visual:"sun",title:"第一条反例",caption:"「昼夜不变、四季不变」是一条观测事实。事实本身不是解释，但它能否决解释。",quiz:{prompt:"这条事实最能削弱下列哪个解释？",options:[{id:"a",correct:!0,label:"太阳照射天线罩，使天线发热产生的附加噪声",explanation:"正确。太阳类解释预言噪声应随日照变化——白天强、夜里弱，夏天强、冬天弱。观测与预言正面冲突，这就是用反例检验模型：数据否决了解释。"},{id:"b",label:"接收机前端放大器增益的长期漂移",explanation:"增益漂移是缓慢、单调的老化过程，本来就不预言昼夜或季节起伏，所以这条事实对它既没有支持也没有否决——它真正的问题是：冷负载校准已周期性扣除了接收机底数。"},{id:"c",label:"某种来自天空的、均匀恒定的背景辐射",explanation:"恰恰相反，这条事实与「天空背景」相容——它甚至悄悄把这个解释留在了桌上。但现在还轮不到它：地面嫌疑人没排完之前，相容不等于成立。"}]}},{id:"p08",act:2,kind:"story",visual:"nyc",title:"嫌疑人一号：城市",caption:"霍尔姆德尔距离纽约市只有 50 公里。雷达站、广播电台、微波中继塔……整座城市日夜不停地向天空泼洒电磁波。一个完美的嫌疑人。"},{id:"p09",act:2,kind:"quiz",visual:"compass",title:"设计一次对质",caption:"要让「城市干扰」这个嫌疑人开口，需要一次观测设计。",quiz:{prompt:"检验「噪声来自城市」最好的观测设计是？",options:[{id:"a",label:"在晴天和雨天分别测量——城市雷达信号受大气衰减的影响与真实天电不同",explanation:"设计得很巧，但一次引入了两个变量：天气既改变大气衰减，也改变天线表面水汽与温度。即使测到差异，也无法归因给「城市」这个具体嫌疑人。对照的铁律是一次只动一个变量。"},{id:"b",correct:!0,label:"对比天线指向纽约方向与背向纽约方向时的噪声强度",explanation:"正确。这是一次干净的对照：只改变指向这一个条件，其余全部保持。若城市是元凶，指向它时噪声应显著增强。结果：指向哪里都一样——城市出局。"},{id:"c",label:"核对无线电管理部门的发射台登记册，逐一排查各台站的频率与功率",explanation:"登记册是「供词」不是「物证」：未登记的源、故障辐射的源都不在册；且知道一个台站的发射功率，不等于知道有多少漏进了这台高增益天线。档案排查辅助可以，定案不行。"}]}},{id:"p10",act:2,kind:"story",visual:"galaxy",title:"嫌疑人二号：银河系",caption:"如果不是地面，那就是天上。银河系本身就是一个巨大的射电源——如果噪声来自银河，它应该在天线扫过银道面时变强，背向银道面时变弱。"},{id:"p11",act:2,kind:"quiz",visual:"isotropy",title:"银河的预言",caption:"每一种解释都必须给出可检验的预言，否则它没有资格留在桌上。",quiz:{prompt:"「噪声来自银河系」这一解释，预言了怎样的观测结果？",options:[{id:"a",label:"噪声应全天大致均匀——我们身处银河系内部，它从四面八方包围我们",explanation:"这是最像对的误解。「身处其中」不等于「均匀」：银河系物质高度集中在银盘上，从银心方向看与垂直银盘方向看，物质柱密度差几个量级。内部视角反而更不均匀。"},{id:"b",label:"噪声应在天体经过子午线时增强——那时信号穿过的大气路径最短",explanation:"这把大气效应嫁接到了银河头上。子午线时刻改变的是大气吸收，对银河与河外信号一视同仁；它不能作为「来自银河」的判别预言。把不相干的预言安在嫌疑人头上，是推理中的稻草人。"},{id:"c",correct:!0,label:"噪声应随天线相对银道面的指向明显起伏",explanation:"正确。银河不是均匀的天幕，银道面集中了绝大部分射电辐射。而实测噪声各向同性——所有方向一模一样。预言落空，银河出局。"}]}},{id:"p12",act:2,kind:"story",visual:"pigeon",title:"嫌疑人三号：住进天线的鸽子",caption:"检查天线内部时，他们发现了一对房客：两只鸽子在喇叭喉部筑了巢，留下一层黏糊糊的「白色介电材料」——鸽粪。这在微波波段可是货真价实的吸收体。"},{id:"p13",act:2,kind:"quiz",visual:"cleanup",title:"清巢之后",caption:"他们清除鸽巢、擦洗内壁，把鸽子送到远处——鸽子飞了回来，最终被无奈「处理」。可噪声几乎分文未少。",quiz:{prompt:"鸽子被排除后，下一步最合理的动作是？",options:[{id:"a",correct:!0,label:"继续拆检天线本身：铆接缝、内表面涂层、结构损耗",explanation:"正确。嫌疑人清单还没查完，仪器自身的结构性损耗仍在逃。排除法的纪律是：清单走完之前，不允许跳到非凡结论。"},{id:"b",label:"把天线指向之前测过的同一天区复测，确认噪声是否随天区变化",explanation:"这确实是好科学——但它已经做过了：各向同性检查排除的正是「随天区变化」的来源。当前在逃的嫌疑人是仪器结构，重复已完成的检验不提供新信息。"},{id:"c",label:"在原鸽巢区域喷涂等效吸波材料，定量复现鸽粪的介电效应",explanation:"定量复现嫌疑人，手法很专业——但清理前后噪声几乎没变，这条对照已经把鸽子洗清了。精细量化一个已排除的嫌疑人，是把弹药打在已经结案的卷宗上。"}]}},{id:"p14",act:2,kind:"story",visual:"rivet",title:"最后的室内排查",caption:"他们拆开天线的铆接缝，重新铆接，给内壁刷上导电漆，一寸一寸地检查。噪声只少了一点点，剩下的部分纹丝不动——像一声不肯闭嘴的低语。"},{id:"p15",act:2,kind:"quiz",visual:"crosscheck",title:"两种立场的分水岭",caption:"至此，桌上的嫌疑人被一个个送走。剩下两种立场：A「还有没查到的地面源」，B「信号来自天空本身」。",quiz:{prompt:"哪条后续证据最能区分这两种立场？",options:[{id:"a",label:"把历史数据按月份分组，与设备维护记录做相关分析",explanation:"相关不等于因果，而且维护事件一年只有几次，样本量撑不起结论。更根本的问题是：相关分析用的仍是同一台仪器的数据，仪器幽灵在里面是常量，相关分析对它失明。"},{id:"b",label:"对天线做全结构电磁仿真，计算理论上可能的噪声上限",explanation:"仿真很强大，但模型里每个接缝参数、每层氧化厚度都是未检验的假设。仿真只能告诉你「模型认为会怎样」，立场 A 怀疑的恰恰是模型没算进去的东西。"},{id:"c",correct:!0,label:"用另一台独立的天线、在另一个波长复测，看同样的信号是否仍出现",explanation:"正确。独立仪器、独立波长的复现，是区分「这台仪器的幽灵」与「天空的真实信号」的判据。仪器幽灵不会搬到别人的仪器里。"}]}},{id:"p16",act:3,kind:"story",visual:"dinner",title:"饭桌上的一句话",caption:"1965 年初，彭齐亚斯在一次学术会议上顺口向 MIT 的无线电天文学家伯克诉苦。伯克想起刚读过的一篇预印本：普林斯顿的迪克小组，正在造一台小型辐射计，去寻找一种「理论上应该存在」的辐射。"},{id:"p17",act:3,kind:"story",visual:"blackbody",title:"一个等待证人的预言",caption:"迪克与皮布尔斯论证：如果宇宙诞生于一个高温致密的早期阶段，那场「开端」的余温今天仍应弥漫全宇宙——约几 K 的黑体辐射，微波波段，各向同性。他们正准备亲手去找，而别人已经测到了。"},{id:"p18",act:3,kind:"quiz",visual:"phone",title:"两组人的对质",caption:"彭齐亚斯拨通了普林斯顿的电话。一边测到了不知来源的信号，一边预言了尚未找到的信号。",quiz:{prompt:"这次相遇之所以构成真正的「检验」，关键在于？",options:[{id:"a",label:"两组成果都将经过《天体物理学报》的同行评议",explanation:"同行评议是发表前的把关，不是这次相遇的检验力来源。即使永不发表，独立预言与独立观测的吻合照样成立；反过来，评议也救不了一个事后拼凑的「预言」。"},{id:"b",correct:!0,label:"实测的温度、波长与各向同性记录，和独立作出的理论预言，在见面之前互不知情",explanation:"正确。一边有观测底稿，一边有预言底稿，且彼此独立得出——预言不是事后凑出来的，观测也不是被理论暗示出来的。独立证据相遇，检验才成立。"},{id:"c",label:"霍尔姆德尔的喇叭天线灵敏度远超普林斯顿的装置，测量精度占主导地位",explanation:"精度衡量的是「测得多准」，独立性回答的是「会不会一起错」。一台再精密的仪器也无法排除自身的系统误差——这正是需要第二双眼睛的原因。"}]}},{id:"p19",act:3,kind:"story",visual:"papers",title:"「我们被人抢先了」",caption:"迪克放下电话，对同事说出了科学史上的名言：「伙计们，我们被人抢先了。」1965 年，两篇论文背靠背刊登在《天体物理学报》：一篇只有一页半，克制地报告了「过量的天线温度」；另一篇给出宇宙学解释。"},{id:"p20",act:3,kind:"quiz",visual:"spectrum",title:"最后一道判别题",caption:"「大爆炸余辉」仍要面对竞争：会不会只是某种未知的、碰巧均匀的前景噪声？",quiz:{prompt:"要区分「大爆炸余辉」与「某种未知均匀前景」，最有判别力的后续观测是？",options:[{id:"a",correct:!0,label:"在多个波长测量辐射强度，检验频谱是否符合黑体曲线",explanation:"正确。黑体谱是大爆炸余辉的定量预言——每个波长上的强度都被温度唯一锁定。后来的 COBE 卫星测得 2.725K 的完美黑体谱，成为整条证据链的最后铆钉。"},{id:"b",label:"对同一天区持续监测数十年，看信号强度是否随宇宙膨胀缓慢衰减",explanation:"方向感很好，但不可检验：宇宙学衰减的时标以亿年计，几代人的监测也测不出变化。一个需要等宇宙变老才能裁决的实验，等于没有实验。"},{id:"c",label:"用更高分辨率扫描小天区，寻找前景中可能存在的离散点源成分",explanation:"值得一做，但逻辑上只能设上限：找不到点源，可能只是分辨率还不够，无法证伪「均匀前景」。而黑体谱是正面预言——证伪与证实，要看解释自己押下了什么可检验的赌注。"}]}},{id:"p21",act:3,kind:"quiz",visual:"verdict",title:"结案意见",caption:"嫌疑人清单：太阳、大气、城市、银河、鸽子、天线结构——逐一排除。幸存解释：宇宙早期高温状态的遗迹辐射。",quiz:{prompt:"哪份结案意见最符合整条证据链？",options:[{id:"a",label:"信号来自大量河外离散射电源的叠加，只是恰好均匀到无法分辨",explanation:"点源叠加会留下统计涨落——像远处人群的嗡嗡声，均匀但细看有颗粒感；而且叠加谱没有理由精确落在黑体曲线上。后来的高灵敏度巡天与 COBE 频谱都没给它留位置。"},{id:"b",correct:!0,label:"排除所有地面与银河来源后，这个各向同性、约 3K、符合黑体谱的信号，支持宇宙曾处于高温致密状态",explanation:"正确。每个嫌疑人都有对应的排除性观测，幸存解释有独立的理论预言与后来的频谱测量加固。证据链的每一环都答得出「你能证明到哪里」。"},{id:"c",label:"3K 仍可能是某种未知的仪器系统效应，因此只能报告「过量天线温度」，不应作宇宙学解释",explanation:"这正是 1965 年那篇论文的克制措辞，作为当时的报告是美德。但结案看的是整条链：独立预言在先、他组复测在后、黑体谱定量吻合——此时继续归因于「未知仪器效应」，就不是谨慎，而是不肯让证据链闭合。"}]}},{id:"p22",act:3,kind:"clue",visual:"checklist",title:"线索卡 · 排除法的完整清单",caption:"太阳（昼夜不变）→ 大气（季节不变）→ 城市（指向对照）→ 银河（各向同性）→ 鸽子（清理对照）→ 天线结构（拆检复测）。每一个排除都对应一条具体观测，不是「我觉得不像」。"},{id:"p23",act:3,kind:"reveal",visual:"medal",title:"终于收到来自人的回信",caption:"1978 年，诺贝尔物理学奖授予彭齐亚斯与威尔逊，「表彰他们发现了宇宙微波背景辐射」。而那两只鸽子，以「科学史上最有名的实验干扰」的身份，被写进了每一本教科书。"},{id:"p24",act:3,kind:"story",visual:"cobe",title:"后来的加固",caption:"1992 年，COBE 卫星公布测量结果：背景辐射的频谱与 2.725K 黑体曲线完美吻合，偏差小于万分之五。预言中的每一条曲线，都等到了它的观测点。"},{id:"p25",act:3,kind:"closing",visual:"sky",title:"结案陈词",caption:"彭齐亚斯与威尔逊从没想过要「发现宇宙的开端」。他们只是不肯放过一段解释不了的噪声，把每一个平凡的可能性查到了底。侦探的第一课：当平凡的解释全部退场，非凡的结论自然无处可逃。"}],K="#19392f",Qe="#dce99c",wt="#d97b3f",ym="#cfe3e0",Ll="#f6f5ef";function bf({n:c=18,seed:f=1}){const r=Array.from({length:c},(s,h)=>{const p=(h*73+f*31)%380+10,S=(h*41+f*17)%130+8,j=(h+f)%3*.5+.8;return d.jsx("circle",{"code-path":"src\\components\\SceneArt.tsx:12:12",cx:p,cy:S,r:j,fill:Qe,opacity:.5+(h+f)%3*.2},h)});return d.jsx(d.Fragment,{children:r})}function vm({x:c=200,y:f=150,s:r=1}){return d.jsxs("g",{"code-path":"src\\components\\SceneArt.tsx:19:5",transform:`translate(${c},${f}) scale(${r})`,children:[d.jsx("path",{"code-path":"src\\components\\SceneArt.tsx:20:7",d:"M-70,-55 L0,0 L-70,55 Z",fill:K}),d.jsx("path",{"code-path":"sr
