<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#f6f5ef"/>
<title>笔尖上的行星 · 科学侦探故事</title>
<meta name="description" content="一篇科学调查故事：天王星为何偏离星表？顺着观测与理论之间的裂缝，从纸上算出一颗没人见过的行星。12 个图文短页、6 处推理。"/>
<style>
/* ============ 基础与配色（仿原作纸感风格） ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f6f5ef; --panel:#fffdf6; --ink:#20372c; --ink-soft:#4a5a50;
  --muted:#7c8a7f; --line:#e0ddcd; --line-dark:#c9c2ae;
  --terra:#b65c49; --terra-deep:#9c4a38; --amber:#a65a30;
  --sage:#5c7b64; --sage-pale:#edf1e5; --sage-line:#d7e0da;
  --night:#16282a; --gold:#c8a55a;
  --serif:Georgia,"Songti SC",STSong,SimSun,serif;
  --sans:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
html{font-size:16px}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.85;-webkit-font-smoothing:antialiased}
body.plain{font-family:var(--sans);line-height:1.9}
body.plain .fig{display:none}
button{font-family:inherit;cursor:pointer}
::selection{background:#eadfc8}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,245,239,.94);backdrop-filter:blur(4px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:860px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.brand{font-size:.95rem;letter-spacing:.14em;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.brand b{color:var(--ink);font-weight:700}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--terra);display:inline-block}
.topbar .spacer{flex:1}
.top-btn{border:1px solid var(--line-dark);background:transparent;color:var(--ink-soft);border-radius:999px;padding:5px 14px;font-size:.82rem;letter-spacing:.06em}
.top-btn:hover{border-color:var(--terra);color:var(--terra)}
.top-btn.on{background:var(--sage-pale);border-color:var(--sage);color:var(--sage)}

.wrap{max-width:860px;margin:0 auto;padding:28px 20px 90px}

/* ============ 书架 ============ */
.hero{padding:34px 0 8px;text-align:left}
.hero .kicker{font-size:.8rem;letter-spacing:.3em;color:var(--terra);margin-bottom:10px}
.hero h1{font-size:2.1rem;font-weight:700;line-height:1.35;letter-spacing:.02em}
.hero p.sub{margin-top:12px;color:var(--ink-soft);font-size:1.02rem;max-width:34em}
.shelf-heading{margin:42px 0 16px;display:flex;align-items:baseline;gap:14px}
.shelf-heading h2{font-size:1.3rem}
.shelf-heading span{font-size:.82rem;color:var(--muted);letter-spacing:.05em}
.book{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 14px rgba(32,55,44,.07)}
.book-cover{width:220px;min-height:300px;flex-shrink:0;background:var(--night);position:relative}
.book-cover svg{display:block;width:100%;height:100%;position:absolute;inset:0}
.book-body{padding:26px 28px 24px;flex:1;display:flex;flex-direction:column;gap:10px}
.book-body .kicker{font-size:.78rem;letter-spacing:.22em;color:var(--sage)}
.book-body h2{font-size:1.55rem;line-height:1.4}
.book-body .hook{color:var(--ink-soft);font-size:.98rem}
.book-body .skill{font-size:.85rem;color:var(--muted)}
.book-body .skill b{color:var(--amber);font-weight:600;letter-spacing:.05em}
.book-body .muted{font-size:.84rem;color:var(--muted)}
.book-actions{margin-top:auto;padding-top:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.shelf-note{margin-top:34px;color:var(--muted);font-size:.86rem;line-height:2;border-top:1px dashed var(--line-dark);padding-top:18px}

/* ============ 按钮 ============ */
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--terra);color:#fffdf6;border:none;border-radius:8px;padding:11px 22px;font-size:.95rem;letter-spacing:.08em;box-shadow:0 2px 8px rgba(182,92,73,.28)}
.btn-primary:hover{background:var(--terra-deep)}
.btn-primary:disabled{background:#c8b8ae;box-shadow:none;cursor:default}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--ink-soft);border:1px solid var(--line-dark);border-radius:8px;padding:10px 20px;font-size:.92rem;letter-spacing:.06em}
.btn-ghost:hover{border-color:var(--terra);color:var(--terra)}
.btn-text{background:none;border:none;color:var(--sage);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.btn-text:hover{color:var(--terra)}

/* ============ 阅读页 ============ */
.reader-head{margin-bottom:6px}
.reader-head .crumb{font-size:.8rem;letter-spacing:.24em;color:var(--terra);margin-bottom:8px}
.reader-head h1{font-size:1.75rem;line-height:1.4;margin-bottom:12px}
.meta-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font-family:var(--sans);font-size:.76rem;letter-spacing:.04em;color:var(--ink-soft);background:var(--sage-pale);border:1px solid var(--sage-line);border-radius:999px;padding:3px 12px}
.chip.who{background:#f6ece6;border-color:#e4cfc2}

.fig{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 22px;box-shadow:0 2px 12px rgba(22,40,42,.10)}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{display:flex;justify-content:space-between;gap:10px;font-family:var(--sans);font-size:.75rem;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);padding:7px 14px;letter-spacing:.05em}

.paras p{margin:0 0 1.15em;font-size:1.06rem;text-align:justify}
.term{border:none;background:transparent;color:var(--amber);font:inherit;border-bottom:1px dashed var(--amber);padding:0 1px}
.term:hover{color:var(--terra);border-color:var(--terra)}

.clue{margin:22px 0;border:1px dashed var(--sage);background:var(--sage-pale);border-radius:10px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.clue .tag{flex-shrink:0;font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;color:#fff;background:var(--sage);border-radius:4px;padding:3px 8px;margin-top:4px}
.clue .clue-title{font-weight:700;font-size:.98rem}
.clue .clue-text{font-size:.9rem;color:var(--ink-soft)}

.closing{margin:26px 0 8px;font-size:1.14rem;color:var(--terra-deep);font-weight:700;letter-spacing:.02em}
.closing::before{content:"—— "}

.note{margin:20px 0;border-top:1px solid var(--line);padding-top:8px}
.note summary{font-family:var(--sans);font-size:.8rem;color:var(--muted);cursor:pointer;letter-spacing:.08em;list-style:none}
.note summary::before{content:"▸ ";color:var(--line-dark)}
.note[open] summary::before{content:"▾ "}
.note .note-body{font-size:.85rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:10px}

/* ============ 推理题 ============ */
.quiz{margin:26px 0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--terra);border-radius:10px;padding:20px 22px;box-shadow:0 2px 10px rgba(32,55,44,.06)}
.quiz .q-tag{font-family:var(--sans);font-size:.72rem;letter-spacing:.24em;color:var(--terra);margin-bottom:8px}
.quiz .q-text{font-size:1.12rem;font-weight:700;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line-dark);border-radius:8px;padding:12px 16px;margin-bottom:10px;font-size:.98rem;color:var(--ink);font-family:inherit;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--terra);background:#fdf6f1}
.opt:disabled{cursor:default}
.opt.wrong{border-color:#cdb9b0;background:#f9f1ec;color:#8a6a5c}
.opt.wrong .opt-mark{color:var(--terra)}
.opt.right{border-color:var(--sage);background:var(--sage-pale)}
.opt .opt-mark{font-family:var(--sans);font-size:.78rem;margin-right:8px;color:var(--muted)}
.opt-result{margin:6px 2px 14px;padding:12px 16px;border-radius:8px;font-size:.92rem;line-height:1.9}
.opt-result.bad{background:#f9f1ec;border:1px dashed #d8b7a6;color:#6d554a}
.opt-result.good{background:var(--sage-pale);border:1px dashed var(--sage);color:var(--ink-soft)}
.opt-result .rt{font-weight:700;display:block;margin-bottom:4px;font-size:.85rem;letter-spacing:.12em;font-family:var(--sans)}
.opt-result.bad .rt{color:var(--terra)}
.opt-result.good .rt{color:var(--sage)}
.opt-result .mini-clue{margin-top:8px;font-size:.85rem;color:var(--ink-soft)}
.opt-result .mini-clue b{color:var(--sage)}
.hint-row{display:flex;align-items:center;gap:12px;margin-top:4px}
.hint-box{margin-top:10px;background:#fdf6e7;border:1px dashed var(--gold);border-radius:8px;padding:10px 16px;font-size:.9rem;color:#7a6234}
.quiz-done-bar{margin-top:6px;display:flex;justify-content:flex-end}

/* ============ 导航与进度 ============ */
.progress{position:sticky;top:49px;z-index:15;background:rgba(246,245,239,.94);padding:10px 0 12px;margin-bottom:14px}
.progress .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--terra);border-radius:99px;transition:width .3s}
.progress .plabel{margin-top:7px;font-family:var(--sans);font-size:.75rem;color:var(--muted);letter-spacing:.1em;display:flex;justify-content:space-between}
.reader-nav{margin-top:34px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:20px}

/* ============ 结算页 ============ */
.score-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:34px 32px;box-shadow:0 3px 16px rgba(32,55,44,.08)}
.score-card .kicker{font-size:.78rem;letter-spacing:.26em;color:var(--terra);margin-bottom:8px}
.score-card h1{font-size:1.7rem;margin-bottom:6px}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}
.score-cell{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff}
.score-cell .num{font-size:1.7rem;font-weight:700;color:var(--terra-deep)}
.score-cell .lab{font-family:var(--sans);font-size:.75rem;color:var(--muted);letter-spacing:.1em;margin-top:2px}
.score-verdict{font-size:1.02rem;color:var(--ink-soft);border-left:3px solid var(--sage);padding-left:14px;margin:10px 0 20px}
.quiz-review{margin:8px 0 20px}
.quiz-review details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.quiz-review summary{padding:10px 16px;font-size:.92rem;cursor:pointer;list-style:none}
.quiz-review summary::before{content:"▸ ";color:var(--line-dark)}
.quiz-review details[open] summary::before{content:"▾ "}
.quiz-review .rv-body{padding:0 16px 12px;font-size:.86rem;color:var(--muted)}

/* ============ 弹层：术语 ============ */
.pop-mask{position:fixed;inset:0;background:rgba(32,55,44,.28);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.pop{background:var(--panel);border:1px solid var(--line-dark);border-radius:12px;max-width:420px;width:100%;padding:24px 26px;box-shadow:0 10px 40px rgba(22,40,42,.25)}
.pop h3{color:var(--amber);font-size:1.15rem;margin-bottom:8px}
.pop p{font-size:.94rem;color:var(--ink-soft)}
.pop .pop-close{margin-top:16px;text-align:right}

footer.site{margin-top:50px;border-top:1px solid var(--line);padding-top:16px;font-family:var(--sans);font-size:.75rem;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (max-width:640px){
  .book{flex-direction:column}
  .book-cover{width:100%;min-height:180px}
  .hero h1{font-size:1.6rem}
  .reader-head h1{font-size:1.4rem}
  .wrap{padding:18px 14px 70px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= 分镜插画（内联 SVG，统一夜色纸感配色） ================= */
const SKY = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3437"/><stop offset="1" stop-color="#0e1c1f"/></linearGradient></defs>`;
const STARS = (()=>{ // 固定伪随机星点
  let out="",s=7;
  const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<46;i++){const x=(rnd()*700+10).toFixed(0),y=(rnd()*250+8).toFixed(0),r=(rnd()*1.5+.5).toFixed(1),o=(rnd()*.6+.25).toFixed(2);
    out+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#dce9c9" opacity="${o}"/>`;}
  return out;
})();

<g stroke="#315e4e" stroke-width="1" opacity=".35">${[60,120,180,240,300].map(y=>`<line x1="0" y1="${y}" x2="720" y2="${y}"/>`).join("")}${[90,180,270,360,450,540,630].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="380"/>`).join("")}</g>

<text x="118" y="100" font-family="Georgia,serif" font-size="16" fill="#315e4e">剑桥</text>

   "1930 年，人们用同样的思路寻找“海外行星”，找到了冥王星——虽然事后证明，那一次更多是走运：冥王星太小，根本拉不动天王星。方法被再次使用，运气没有再次站在同一边。",
   "天空没有变，变的是人们读它的方式：异常常被当作路牌，证据链要一环不缺，对照要有底图，成功也要对账。",
   "下一道裂缝出现在哪里，没有人事先知道。但已经有人学会了，怎样顺着它找下去。"
  ],
  clue:{title:"异常常是指路牌", text:"理论与现实之间的裂缝，有时正是新事物敲门的声音。"},
  closing:"全卷终。",
  note:"冥王星的发现方式与海王星相似，但其质量远不足以解释天王星的偏差，科学史上视为方法与运气的又一次混合。"
 }
);
/* ================= 游戏引擎 ================= */
const LS_KEY = "neptune-pen-v1";
const SCENE_TERMS = {s03:["arcmin","perturb"], s04:["bode"], s06:["starchart"], s07:["mag8"], s08:["starchart"], s09:["mag8","starchart"], s10:["bode","elements"]};
const TERM_MAP = Object.fromEntries(TERMS.map(t=>[t.id,t]));
const SCENES = STORY.scenes;
const N = SCENES.length;

function blankState(){
  return {v:1, cursor:0, furthest:0, answers:{}, opinion:{}, startedAt:new Date().toISOString(), completedAt:null};
}
function loadState(){ try{const s=JSON.parse(localStorage.getItem(LS_KEY)); return s&&s.v===1?s:null;}catch(e){return null;} }
let state = loadState() || blankState();
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
const $app = document.getElementById("app");
let plainMode = false;
let view = "shelf";

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const nowIso = ()=>new Date().toISOString();

/* ---------- 文本中的术语标注 ---------- */
function linkTerms(text){
  let out = esc(text);
  for(const t of TERMS){
    if(out.includes(t.term)) out = out.split(t.term).join(`<button class="term" data-term="${t.id}">${t.term}</button>`);
  }
  return out;
}

/* ---------- 顶栏 ---------- */
function topbar(){
  return `<div class="topbar"><div class="topbar-inner">
    <span class="brand"><span class="dot"></span><b>笔尖上的行星</b> · 科学侦探故事</span>
    <span class="spacer"></span>
    ${view!=="shelf"?`<button class="top-btn" data-act="shelf">书架</button>`:""}
    <button class="top-btn ${plainMode?"on":""}" data-act="plain">${plainMode?"图文模式":"简洁阅读"}</button>
    ${state.completedAt&&view!=="score"?`<button class="top-btn" data-act="score">成绩</button>`:""}
  </div></div>`;
}

/* ---------- 书架 ---------- */
function renderShelf(){
  const done = !!state.completedAt;
  const started = state.furthest>0 || state.cursor>0;
  const quizzes = SCENES.filter(s=>s.quiz).length;
  const answered = SCENES.filter(s=>s.quiz&&state.answers[s.id]&&state.answers[s.id].passed).length;
  const progressTxt = done
    ? "已读完全卷 · 随时重访线索"
    : started
      ? `书签：第 ${state.cursor+1} 页 · ${SCENES[Math.min(state.cursor,N-1)].title}`
      : `尚未开始 · ${N} 幅分镜 · ${quizzes} 处推理`;
  $app.innerHTML = topbar() + `
  <div class="wrap">
    <section class="hero">
      <p class="kicker">迷雾中的探险 · 科学侦探故事</p>
      <h1>一页一幅画面。<br/>在谜底揭晓前，由你判断下一步。</h1>
      <p class="sub">和研究者一起经历困惑、碰壁与重新出发，直到一条线索照亮另一条。</p>
    </section>
    <div class="shelf-heading"><h2>全部故事</h2><span>本卷独立成篇 · 自由进入</span></div>
    <article class="book">
      <div class="book-cover">${FIG.neptune}</div>
      <div class="book-body">
        <p class="kicker">建议第 01 卷 · 观测与理论的裂缝</p>
        <h2>${STORY.title} · ${STORY.subtitle}</h2>
        <p class="hook">${STORY.tagline}</p>
        <p class="skill"><b>核心练习</b> ${STORY.skill}</p>
        <p class="muted">${progressTxt}${started&&!done?` · 推理已过 ${answered}/${quizzes}`:""}</p>
        <div class="book-actions">
          <button class="btn-primary" data-act="open">${done?"重访故事":started?"从书签继续":"翻开故事"} →</button>
          ${done?`<button class="btn-ghost" data-act="score">查看成绩</button>`:""}
          ${started?`<button class="btn-text" data-act="restart">从头重读</button>`:""}
        </div>
      </div>
    </article>
    <p class="shelf-note">每道题都依据当时掌握的证据判断；答错后看解析、再作答，选对后继续。需要时可查看提示。<br/>
    关键记录由你亲手翻开；也有一处不计分的倾向，留给你自己回望。<br/>
    书签与成绩保存在本机；历史注记可在阅读时按需展开，区分史实与叙述的加工。</p>
    <footer class="site"><span>笔尖上的行星 · 海王星发现之谜</span><span>12 幅分镜 · 6 处推理 · 1 处倾向</span></footer>
  </div>`;
}

/* ---------- 阅读页 ---------- */
function renderReader(){
  const sc = SCENES[state.cursor];
  const ans = state.answers[sc.id];
  const hasQuiz = !!sc.quiz;
  const passed = !hasQuiz || (ans && ans.passed);
  const isLast = state.cursor === N-1;

  const chips = [
    `<span class="chip">${esc(sc.date)}</span>`,
    `<span class="chip">${esc(sc.place)}</span>`,
    ...sc.people.map(p=>`<span class="chip who">${esc(p)}</span>`)
  ].join("");
  const termChips = (SCENE_TERMS[sc.id]||[]).map(id=>`<button class="chip term-chip" data-term="${id}" style="cursor:pointer">术语 · ${esc(TERM_MAP[id].term)}</button>`).join("");

  const paras = sc.paras.map(p=>`<p>${linkTerms(p)}</p>`).join("");

  const fig = `<figure class="fig">${FIG[sc.fig]||""}<figcaption class="cap"><span>${esc(sc.figCap)}</span><span>第 ${state.cursor+1} / ${N} 页</span></figcaption></figure>`;

  let quizHtml = "";
  if(hasQuiz){
    const q = sc.quiz;
    const opts = q.options.map(o=>{
      const at = ans ? ans.attempts : [];
      const triedWrong = at.includes(o.id) && o.id!==q.answer;
      const isRight = ans && ans.passed && o.id===q.answer;
      let cls = "opt"+(triedWrong&&!isRight?" wrong":"")+(isRight?" right":"");
      let mark = isRight?'<span class="opt-mark">✓</span>':triedWrong?'<span class="opt-mark">✗</span>':'<span class="opt-mark">○</span>';
      let resHtml = "";
      if(at.includes(o.id)){
        const good = o.id===q.answer;
        resHtml = `<div class="opt-result ${good?"good":"bad"}"><span class="rt">${good?"此路可通":"此路不通"} · ${esc(o.tag)}</span>${o.result.map(r=>`<p style="margin-bottom:.4em">${esc(r)}</p>`).join("")}<p class="mini-clue">线索 · <b>${esc(o.clue.title)}</b> — ${esc(o.clue.text)}</p></div>`;
      }
      return `<button class="${cls}" data-act="choose" data-id="${o.id}" ${ans&&ans.passed?"disabled":""}>${mark}${esc(o.label)}</button>${resHtml}`;
    }).join("");
    const hintBtn = ans&&ans.hint ? "" : `<button class="btn-text" data-act="hint" ${ans&&ans.passed?"disabled":""}>需要提示</button>`;
    const hintBox = ans&&ans.hint ? `<div class="hint-box">提示：${esc(q.hint)}</div>` : "";
    quizHtml = `<div class="quiz">
      <p class="q-tag">${esc(q.tag)}</p>
      <p class="q-text">${esc(q.q)}</p>
      ${opts}
      <div class="hint-row">${ans&&ans.passed?`<span style="font-size:.82rem;color:var(--sage)">推理通过 · ${(ans.attempts.length===1&&!ans.hint)?"一次命中":`尝试 ${ans.attempts.length} 次${ans.hint?" · 用过提示":""}`}</span>`:hintBtn}</div>
      ${hintBox}
    </div>`;
  }

  let opinionHtml = "";
  if(sc.opinion){
    const cur = state.opinion[sc.id];
    opinionHtml = `<div class="quiz" style="border-left-color:var(--sage)">
      <p class="q-tag" style="color:var(--sage)">${esc(sc.opinion.tag)}</p>
      <p class="q-text">${esc(sc.opinion.q)}</p>
      ${sc.opinion.options.map(o=>`<button class="opt ${cur===o.id?"right":""}" data-act="opinion" data-id="${o.id}"><span class="opt-mark">${cur===o.id?"✓":"○"}</span>${esc(o.label)}</button>`).join("")}
      ${cur?`<p style="font-size:.84rem;color:var(--muted)">已记下你的倾向。它与成绩无关——多年以后，你会想知道今天的自己怎样想。</p>`:""}
    </div>`;
  }

  const pct = Math.round(((state.cursor+1)/N)*100);
  $app.innerHTML = topbar() + `
  <div class="wrap">
    <div class="progress">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="plabel"><span>${esc(sc.chapter)}</span><span>第 ${state.cursor+1} / ${N} 页</span></div>
    </div>
    <header class="reader-head">
      <p class="crumb">${esc(sc.chapter)}</p>
      <h1>${esc(sc.title)}</h1>
      <div class="meta-chips">${chips}${termChips}</div>
    </header>
    ${fig}
    <div class="paras">${paras}</div>
    <div class="clue"><span class="tag">线索</span><div><p class="clue-title">${esc(sc.clue.title)}</p><p class="clue-text">${esc(sc.clue.text)}</p></div></div>
    ${quizHtml}
    ${opinionHtml}
    <details class="note"><summary>历史注记 · 史实与叙述的边界</summary><div class="note-body">${esc(sc.note)}</div></details>
    <p class="closing">${esc(sc.closing)}</p>
    <nav class="reader-nav">
      <button class="btn-ghost" data-act="prev" ${state.cursor===0?"disabled":""}>← 上一页</button>
      ${isLast
        ? `<button class="btn-primary" data-act="finish" ${passed?"":"disabled"}>完成阅读 · 查看成绩 →</button>`
        : `<button class="btn-primary" data-act="next" ${passed?"":"disabled"}>${passed?"继续 →":"先完成本页推理"}</button>`}
    </nav>
  </div>`;
  window.scrollTo({top:0});
}

/* ---------- 结算页 ---------- */
function gradeOf(){
  const qs = SCENES.filter(s=>s.quiz);
  const firstTry = qs.filter(s=>{const a=state.answers[s.id];return a&&a.passed&&a.attempts.length===1;}).length;
  const hints = qs.filter(s=>state.answers[s.id]&&state.answers[s.id].hint).length;
  const attempts = qs.reduce((n,s)=>n+((state.answers[s.id]||{attempts:[]}).attempts.length),0);
  return {qs:qs.length, firstTry, hints, attempts};
}
function verdict(g){
  if(g.firstTry===g.qs) return "六处推理全部一次命中——你读裂缝的方式，已经接近当年的勒维耶。";
  if(g.firstTry>=4) return "多数推理一次命中。偶尔走错的路，也被你换成了线索。";
  if(g.firstTry>=2) return "你愿意在岔路口停下来听证据说话——这正是调查者最要紧的习惯。";
  return "每一条走不通的路都认真走过了。科学史上的真相，也是这样被剩下的。";
}
function renderScore(){
  const g = gradeOf();
  const dur = state.completedAt ? Math.max(1,Math.round((Date.parse(state.completedAt)-Date.parse(state.startedAt))/60000)) : null;
  const review = SCENES.filter(s=>s.quiz).map((s,i)=>{
    const a = state.answers[s.id]||{attempts:[],hint:false};
    return `<details><summary>推理 ${String(i+1).padStart(2,"0")} · ${esc(s.title)} — ${a.attempts[0]===s.quiz.answer?"一次命中":`尝试 ${a.attempts.length} 次`}${a.hint?" · 用过提示":""}</summary>
      <div class="rv-body"><p>${esc(s.quiz.q)}</p><p style="margin-top:6px">正解：${esc(s.quiz.options.find(o=>o.id===s.quiz.answer).label)}</p></div></details>`;
  }).join("");
  $app.innerHTML = topbar() + `
  <div class="wrap">
    <div class="score-card">
      <p class="kicker">本卷成绩 · ${STORY.title}</p>
      <h1>顺着裂缝找到尽头的人</h1>
      <div class="score-grid">
        <div class="score-cell"><div class="num">${g.firstTry} / ${g.qs}</div><div class="lab">首次命中</div></div>
        <div class="score-cell"><div class="num">${g.attempts}</div><div class="lab">总尝试次数</div></div>
        <div class="score-cell"><div class="num">${g.hints}</div><div class="lab">使用提示</div></div>
        <div class="score-cell"><div class="num">${dur===null?"—":dur}</div><div class="lab">阅读时长（分钟）</div></div>
      </div>
      <p class="score-verdict">${verdict(g)}</p>
      <div class="quiz-review">${review}</div>
      <div class="book-actions">
        <button class="btn-primary" data-act="restart">再读一遍</button>
        <button class="btn-ghost" data-act="shelf">回到书架</button>
      </div>
    </div>
  </div>`;
  window.scrollTo({top:0});
}

/* ---------- 术语弹层 ---------- */
function showTerm(id){
  const t = TERM_MAP[id]; if(!t) return;
  const mask = document.createElement("div");
  mask.className = "pop-mask";
  mask.innerHTML = `<div class="pop"><h3>${esc(t.term)}</h3><p>${esc(t.meaning)}</p><p class="pop-close"><button class="btn-ghost" data-close>合上</button></p></div>`;
  mask.addEventListener("click", e=>{ if(e.target===mask || e.target.closest("[data-close]")) mask.remove(); });
  document.body.appendChild(mask);
}

/* ---------- 渲染入口与事件 ---------- */
function render(){
  document.body.classList.toggle("plain", plainMode);
  if(view==="shelf") renderShelf();
  else if(view==="reader") renderReader();
  else renderScore();
}

$app.addEventListener("click", e=>{
  const termBtn = e.target.closest(".term, .term-chip");
  if(termBtn){ showTerm(termBtn.dataset.term); return; }
  const btn = e.target.closest("[data-act]");
  if(!btn || btn.disabled) return;
  const act = btn.dataset.act;
  const sc = SCENES[state.cursor];

  if(act==="shelf"){ view="shelf"; render(); }
  else if(act==="plain"){ plainMode=!plainMode; render(); }
  else if(act==="score"){ view="score"; render(); }
  else if(act==="open"){ view="reader"; render(); }
  else if(act==="restart"){
    if(confirm("从头重读将清空当前书签与本次作答，确定吗？")){ state = blankState(); save(); view="reader"; render(); }
  }
  else if(act==="prev"){ if(state.cursor>0){ state.cursor--; save(); render(); } }
  else if(act==="next"){
    if(state.cursor < N-1){
      state.cursor++;
      state.furthest = Math.max(state.furthest, state.cursor);
      save(); render();
    }
  }
  else if(act==="finish"){
    if(!state.completedAt) state.completedAt = nowIso();
    save(); view="score"; render();
  }
  else if(act==="hint"){
    const a = state.answers[sc.id] || (state.answers[sc.id]={attempts:[],hint:false,passed:false});
    a.hint = true; save(); render();
  }
  else if(act==="choose"){
    if(!sc.quiz) return;
    const a = state.answers[sc.id] || (state.answers[sc.id]={attempts:[],hint:false,passed:false});
    const id = btn.dataset.id;
    if(!a.attempts.includes(id)) a.attempts.push(id);
    if(id===sc.quiz.answer) a.passed = true;
    save(); render();
    if(a.passed){ const nav=document.querySelector(".reader-nav"); if(nav) nav.scrollIntoView({behavior:"smooth",block:"end"}); }
  }
  else if(act==="opinion"){
    state.opinion[sc.id] = btn.dataset.id; save(); render();
  }
});

render();
</script>
</body>
</html>
