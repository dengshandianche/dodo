匀背景，你会把它当成零点一起扣掉。对照的锚点必须来自已知，不能来自测量本身。"},{id:"b",correct:!0,label:"把接收机接到一个浸在液氦中的冷负载上——它的噪声温度可以从物理定律算出来",explanation:"正确。冷负载是一个理论值已知的「标准答案」：仪器读数与它对比，偏差就是仪器自身的底数。对照的核心是给测量一个已知锚点，且这个锚点不能来自待测对象。"},{id:"c",label:"连续记录一周的读数，用平均值作为基准线",explanation:"平均值里混着正要测的东西——待测信号会被一并平均进「基准」，之后就再也分不出来了。基准必须独立于待测对象。"}]}},{id:"p04",act:1,kind:"story",visual:"noise",title:"多出来的 3K",caption:"校准完成，底数清晰。可无论怎么测，天顶方向始终多出约 3K 的噪声温度——折合天线温度约 3.5K。这不在任何说明书里，也不在任何预期里。"},{id:"p05",act:1,kind:"quiz",visual:"stance",title:"面对异常的第一立场",caption:"一段没人预期过的噪声，静静躺在记录本上。",quiz:{prompt:"面对「多出来的 3K」，最合理的第一步立场是？",options:[{id:"a",label:"先查文献，看别的天文台有没有报告过类似的过量噪声",explanation:"直觉不错，但顺序不对：自己的仪器底数还没查清，就没有可以拿去比对的「它」。而且别人没报告，也可能只是别人从没做过这么细的绝对校准。"},{id:"b",label:"3K 太小，先记下来不管，等它变大再处理",explanation:"瑞利当年没有忽略「空气里多出来的一点重量」，那一点重量是氩。异常的意义不由大小决定，而由「能不能解释」决定。"},{id:"c",correct:!0,label:"先假设是自己还没弄懂这台仪器，把每个环节从头重查",explanation:"正确。科学惯例是：在宣布非凡发现之前，先穷尽平凡的解释。3K 太小，仪器嫌疑最大——这不丢人，这正是纪律。后来他们花了一年做的，正是这件事。"}]}},{id:"p06",act:1,kind:"story",visual:"daynight",title:"与时间无关",caption:"他们开始记录噪声的行为方式：白天测，夜里测；夏天测，冬天测。结果令人不安——噪声昼夜不变，四季不变，像一段恒定的背景，沉默地杵在那里。"},{id:"p07",act:1,kind:"quiz",visual:"sun",title:"第一条反例",caption:"「昼夜不变、四季不变」是一条观测事实。事实本身不是解释，但它能否决解释。",quiz:{prompt:"这条事实最能削弱下列哪个解释？",options:[{id:"a",correct:!0,label:"太阳照射天线罩，使天线发热产生的附加噪声",explanation:"正确。太阳类解释预言噪声应随日照变化——白天强、夜里弱，夏天强、冬天弱。观测与预言正面冲突，这就是用反例检验模型：数据否决了解释。"},{id:"b",label:"接收机前端放大器增益的长期漂移",explanation:"增益漂移是缓慢、单调的老化过程，本来就不预言昼夜或季节起伏，所以这条事实对它既没有支持也没有否决——它真正的问题是：冷负载校准已周期性扣除了接收机底数。"},{id:"c",label:"某种来自天空的、均匀恒定的背景辐射",explanation:"恰恰相反，这条事实与「天空背景」相容——它甚至悄悄把这个解释留在了桌上。但现在还轮不到它：地面嫌疑人没排完之前，相容不等于成立。"}]}},{id:"p08",act:2,kind:"story",visual:"nyc",title:"嫌疑人一号：城市",caption:"霍尔姆德尔距离纽约市只有 50 公里。雷达站、广播电台、微波中继塔……整座城市日夜不停地向天空泼洒电磁波。一个完美的嫌疑人。"},{id:"p09",act:2,kind:"quiz",visual:"compass",title:"设计一次对质",caption:"要让「城市干扰」这个嫌疑人开口，需要一次观测设计。",quiz:{prompt:"检验「噪声来自城市」最好的观测设计是？",options:[{id:"a",label:"等到后半夜电台最少的时候再测一次",explanation:"后半夜干扰确实少，但气温、大气湿度也跟着变了——一次动了多个条件，就算噪声有变化，也无法归因给「城市」。对照的铁律是一次只动一个变量。"},{id:"b",correct:!0,label:"对比天线指向纽约方向与背向纽约方向时的噪声强度",explanation:"正确。这是一次干净的对照：只改变指向这一个条件，其余全部保持。若城市是元凶，指向它时噪声应显著增强。结果：指向哪里都一样——城市出局。"},{id:"c",label:"核对无线电管理部门的发射台登记册，逐一排查台站的频率与功率",explanation:"登记册是「供词」不是「物证」：未登记的源、故障辐射的源都不在册；知道一个台站的发射功率，也不等于知道有多少漏进了这台高增益天线。档案排查可以辅助，不能定案。"}]}},{id:"p10",act:2,kind:"story",visual:"galaxy",title:"嫌疑人二号：银河系",caption:"如果不是地面，那就是天上。银河系本身就是一个巨大的射电源——如果噪声来自银河，它应该在天线扫过银道面时变强，背向银道面时变弱。"},{id:"p11",act:2,kind:"quiz",visual:"isotropy",title:"银河的预言",caption:"每一种解释都必须给出可检验的预言，否则它没有资格留在桌上。",quiz:{prompt:"「噪声来自银河系」这一解释，预言了怎样的观测结果？",options:[{id:"a",label:"噪声应全天大致均匀——我们身处银河系内部，它从四面八方包围我们",explanation:"这是最像对的误解。「身处其中」不等于「均匀」：银河系的物质高度集中在银盘上，顺着银盘看和垂直银盘看，物质差着好几个量级。内部视角反而更不均匀。"},{id:"b",label:"噪声应在冬季的深夜最强——那时大气最干净，信号传得最好",explanation:"这描述的是观测条件的好坏，不是信号来源的预言。冬季深夜改变的是地球大气，它对银河信号和任何其他信号一视同仁，无法用来辨认「来自银河」。"},{id:"c",correct:!0,label:"噪声应随天线相对银道面的指向明显起伏",explanation:"正确。银河不是均匀的天幕，银道面集中了绝大部分射电辐射。而实测噪声各向同性——所有方向一模一样。预言落空，银河出局。"}]}},{id:"p12",act:2,kind:"story",visual:"pigeon",title:"嫌疑人三号：住进天线的鸽子",caption:"检查天线内部时，他们发现了一对房客：两只鸽子在喇叭喉部筑了巢，留下一层黏糊糊的「白色介电材料」——鸽粪。这在微波波段可是货真价实的吸收体。"},{id:"p13",act:2,kind:"quiz",visual:"cleanup",title:"清巢之后",caption:"他们清除鸽巢、擦洗内壁，把鸽子送到远处——鸽子飞了回来，最终被无奈「处理」。可噪声几乎分文未少。",quiz:{prompt:"鸽子被排除后，下一步最合理的动作是？",options:[{id:"a",correct:!0,label:"继续拆检天线本身：铆接缝、内表面涂层、结构损耗",explanation:"正确。嫌疑人清单还没查完，仪器自身的结构性损耗仍在逃。排除法的纪律是：清单走完之前，不允许跳到非凡结论。"},{id:"b",label:"地面来源查得差不多了，可以宣布这是来自宇宙的信号",explanation:"「查得差不多」不等于「查完」。天线结构损耗这个最贴身的嫌疑人还没过堂，此时宣布发现，等于在证据链的断口处强行结案。"},{id:"c",label:"再买几只鸽子放回天线，重新做对照实验",explanation:"清理前后噪声几乎没变，鸽子的嫌疑已经被这条对照洗清了。重复已完成的检验不提供新信息——侦探的时间要花在还没排除的嫌疑人身上。"}]}},{id:"p14",act:2,kind:"story",visual:"rivet",title:"最后的室内排查",caption:"他们拆开天线的铆接缝，重新铆接，给内壁刷上导电漆，一寸一寸地检查。噪声只少了一点点，剩下的部分纹丝不动——像一声不肯闭嘴的低语。"},{id:"p15",act:2,kind:"quiz",visual:"crosscheck",title:"两种立场的分水岭",caption:"至此，桌上的嫌疑人被一个个送走。剩下两种立场：A「还有没查到的地面源」，B「信号来自天空本身」。",quiz:{prompt:"哪条后续证据最能区分这两种立场？",options:[{id:"a",label:"把这台天线再彻底清扫、拆检一遍",explanation:"同一台仪器上的重复排查，排除不了「这台仪器本身」这个假设。检验的效力来自独立性，而不是重复次数。"},{id:"b",label:"请几位资深天文学家根据经验判断哪种立场更可信",explanation:"经验判断属于「谁说了什么」，不属于证据。两种立场的区别是可检验的预言——该由观测来裁决，而不是由资历来裁决。"},{id:"c",correct:!0,label:"用另一台独立的天线、在另一个波长复测，看同样的信号是否仍出现",explanation:"正确。独立仪器、独立波长的复现，是区分「这台仪器的幽灵」与「天空的真实信号」的判据。仪器幽灵不会搬到别人的仪器里。"}]}},{id:"p16",act:3,kind:"story",visual:"dinner",title:"饭桌上的一句话",caption:"1965 年初，彭齐亚斯在一次学术会议上顺口向 MIT 的无线电天文学家伯克诉苦。伯克想起刚读过的一篇预印本：普林斯顿的迪克小组，正在造一台小型辐射计，去寻找一种「理论上应该存在」的辐射。"},{id:"p17",act:3,kind:"story",visual:"blackbody",title:"一个等待证人的预言",caption:"迪克与皮布尔斯论证：如果宇宙诞生于一个高温致密的早期阶段，那场「开端」的余温今天仍应弥漫全宇宙——约几 K 的黑体辐射，微波波段，各向同性。他们正准备亲手去找，而别人已经测到了。"},{id:"p18",act:3,kind:"quiz",visual:"phone",title:"两组人的对质",caption:"彭齐亚斯拨通了普林斯顿的电话。一边测到了不知来源的信号，一边预言了尚未找到的信号。",quiz:{prompt:"这次相遇之所以构成真正的「检验」，关键在于？",options:[{id:"a",label:"迪克是普林斯顿的教授，理论组的判断力可以为这次测量背书",explanation:"权威背书属于「谁说了什么」，不属于证据。赝品案那一课：名望要接受检验，而不是代替检验。"},{id:"b",correct:!0,label:"实测的温度、波长与各向同性记录，和独立作出的理论预言，在见面之前互不知情",explanation:"正确。一边有观测底稿，一边有预言底稿，且彼此独立得出——预言不是事后凑出来的，观测也不是被理论暗示出来的。独立证据相遇，检验才成立。"},{id:"c",label:"两边都用同一台喇叭天线复测一遍，方便直接对比数据",explanation:"恰恰不能共用同一台仪器：仪器幽灵会跟着仪器走，两边用同一台设备等于只有一双眼睛。这次相遇的价值正在于彼此独立。"}]}},{id:"p19",act:3,kind:"story",visual:"papers",title:"「我们被人抢先了」",caption:"迪克放下电话，对同事说出了科学史上的名言：「伙计们，我们被人抢先了。」1965 年，两篇论文背靠背刊登在《天体物理学报》：一篇只有一页半，克制地报告了「过量的天线温度」；另一篇给出宇宙学解释。"},{id:"p20",act:3,kind:"quiz",visual:"spectrum",title:"最后一道判别题",caption:"「大爆炸余辉」仍要面对竞争：会不会只是某种未知的、碰巧均匀的前景噪声？",quiz:{prompt:"要区分「大爆炸余辉」与「某种未知均匀前景」，最有判别力的后续观测是？",options:[{id:"a",correct:!0,label:"在多个波长测量辐射强度，检验频谱是否符合黑体曲线",explanation:"正确。黑体谱是大爆炸余辉的定量预言——每个波长上的强度都被温度唯一锁定。后来的 COBE 卫星测得 2.725K 的完美黑体谱，成为整条证据链的最后铆钉。"},{id:"b",label:"申请建造一台更大的喇叭天线，用更高的灵敏度再测一次",explanation:"更大的天线提高灵敏度，但回答的还是同一个问题。判别两种解释需要的是新的检验维度——频谱形状，而不是一把更大的同型尺子。"},{id:"c",label:"统计天文学界有多少人支持大爆炸理论",explanation:"支持率不是证据。未知前景与大爆炸余辉的区别写在频谱里，不写在人心里。"}]}},{id:"p21",act:3,kind:"quiz",visual:"verdict",title:"结案意见",caption:"嫌疑人清单：太阳、大气、城市、银河、鸽子、天线结构——逐一排除。幸存解释：宇宙早期高温状态的遗迹辐射。",quiz:{prompt:"哪份结案意见最符合整条证据链？",options:[{id:"a",label:"鸽子粪造成的噪声被误读成宇宙信号，整个发现是一场乌龙",explanation:"鸽子粪在清理前后噪声几乎不变，早已被对照实验洗清。把已排除的嫌疑人写进结案意见，是证据链的倒放。"},{id:"b",correct:!0,label:"排除所有地面与银河来源后，这个各向同性、约 3K、符合黑体谱的信号，支持宇宙曾处于高温致密状态",explanation:"正确。每个嫌疑人都有对应的排除性观测，幸存解释有独立的理论预言与后来的频谱测量加固。证据链的每一环都答得出「你能证明到哪里」。"},{id:"c",label:"稳恒态宇宙模型也能解释这种辐射，所以证据没有判别力",explanation:"稳恒态模型并没有预言这种背景——无始无终的宇宙不需要一场高温开端的余温，精确的黑体谱对它更是无法解释的反例。「也能解释」要拿出具体机制才算数。"}]}},{id:"p22",act:3,kind:"clue",visual:"checklist",title:"线索卡 · 排除法的完整清单",caption:"太阳（昼夜不变）→ 大气（季节不变）→ 城市（指向对照）→ 银河（各向同性）→ 鸽子（清理对照）→ 天线结构（拆检复测）。每一个排除都对应一条具体观测，不是「我觉得不像」。"},{id:"p23",act:3,kind:"reveal",visual:"medal",title:"终于收到来自人的回信",caption:"1978 年，诺贝尔物理学奖授予彭齐亚斯与威尔逊，「表彰他们发现了宇宙微波背景辐射」。而那两只鸽子，以「科学史上最有名的实验干扰」的身份，被写进了每一本教科书。"},{id:"p24",act:3,kind:"story",visual:"cobe",title:"后来的加固",caption:"1992 年，COBE 卫星公布测量结果：背景辐射的频谱与 2.725K 黑体曲线完美吻合，偏差小于万分之五。预言中的每一条曲线，都等到了它的观测点。"},{id:"p25",act:3,kind:"closing",visual:"sky",title:"结案陈词",caption:"彭齐亚斯与威尔逊从没想过要「发现宇宙的开端」。他们只是不肯放过一段解释不了的噪声，把每一个平凡的可能性查到了底。侦探的第一课：当平凡的解释全部退场，非凡的结论自然无处可逃。"}],K="#19392f",Ze="#dce99c",wt="#d97b3f",gm="#cfe3e0",Ll="#f6f5ef";function Ef({n:c=18,seed:f=1}){const o=Array.from({length:c},(s,h)=>{const p=(h*73+f*31)%380+10,S=(h*41+f*17)%130+8,R=(h+f)%3*.5+.8;return d.jsx("circle",{"code-path":"src\\components\\SceneArt.tsx:12:12",cx:p,cy:S,r:R,fill:Ze,opacity:.5+(h+f)%3*.2},h)});return d.jsx(d.Fragment,{children:o})}function xm({x:c=200,y:f=150,s:o=1}){return d.jsxs("g",{"code-path":"src\\components\\SceneArt.tsx:19:5",transform:`translate(${c},${f}) scale(${o})`,children:[d.jsx("path",{"code-path":"src\\components\\SceneArt.tsx:20:7",d:"M-70,-55 L0,0 L-70,55 Z",fill:K}),d.jsx("path",{"code-path":"src\\components\\SceneArt.tsx:21:7",d:"M-70,-55 L-95,-70 L-95,70 L-70,55 Z",fill:wt}),d.jsx("rect",{"code-path":"src\\components\\SceneArt.tsx:22:7",x:"-8",y:"-4",width:"55",height:"8",fill:K}),d.jsx("rect",{"code-path":"src\\components\\SceneArt.tsx:23:7",x:"40",y:"-14",width:"10",height:"28",fill:K}),d.jsx("line",{"code-path":"src\\components\\SceneArt.tsx:24:7",x1:"0",y1:"0",x2:"0",y2:"60"
